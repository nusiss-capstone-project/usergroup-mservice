services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: usergroup_ms_db
    # Pure memory, disappears when CI ends
    tmpfs: /var/lib/postgresql/data
    networks:
      ci-net:
        aliases:
          - postgres-container

  usergroup-mservice:
    build:
      context: ../../server
      dockerfile: Dockerfile
    container_name: usergroup-mservice
    environment:
      - POSTGRES_DSN=postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres-container:5432/usergroup_ms_db?sslmode=disable
    depends_on:
      - postgres
    networks:
      - ci-net
    ports:
      - "8080:8080"   # 只给宿主机（ZAP）用
    command: ["sh", "-c", "apk add --no-cache netcat-openbsd && chmod +x /app/wait-for.sh && ./wait-for.sh postgres-container 5432 ./main"]
    volumes:
      - ./wait-for.sh:/app/wait-for.sh   # CI 专用配置
    user: root
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/usergroup-ms/v1/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
networks:
  ci-net:
