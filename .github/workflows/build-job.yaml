name: Build and Push Job Image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Image tag environment prefix
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set version tag
        id: version
        run: |
          TIMESTAMP="$(date -u +%Y%m%d%H%M)"
          ENV="${{ github.event.inputs.environment }}"
          TAG="job-${ENV}-${TIMESTAMP}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Version tag: ${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push job image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./job
          file: ./job/Dockerfile
          push: true
          tags: |
            ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_REPOSITORY }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        run: |
          echo "### Job Image Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: \`${{ vars.ACR_REGISTRY }}/${{ vars.ACR_REPOSITORY }}:${{ steps.version.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
